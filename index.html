<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Подготовка к аккредитации</title>
<style>
  :root {
    --bg: #eef3f2;
    --surface: #ffffff;
    --ink: #14262b;
    --muted: #5d7278;
    --line: #d5e0de;
    --primary: #0f6e6e;
    --primary-ink: #ffffff;
    --primary-soft: #dcefed;
    --ok: #1e8a4c;
    --ok-soft: #dff3e6;
    --bad: #c23b3b;
    --bad-soft: #fbe4e4;
    --hint: #b97a00;
    --hint-soft: #fff1cf;
    --radius: 16px;
    --shadow: 0 6px 24px rgba(20, 38, 43, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1a1d;
      --surface: #16272b;
      --ink: #e8f1f0;
      --muted: #93a9ae;
      --line: #2a4046;
      --primary: #3fb5b0;
      --primary-ink: #06201f;
      --primary-soft: #1b3a3c;
      --ok: #55d08a;
      --ok-soft: #1b3b2a;
      --bad: #ff8585;
      --bad-soft: #402124;
      --hint: #f0b84a;
      --hint-soft: #3d3117;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  #app { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }

  h1 { font-size: 1.75rem; line-height: 1.2; margin: 8px 0 6px; letter-spacing: -0.01em; }
  h2 { font-size: 1.15rem; margin: 0 0 12px; }
  .lead { color: var(--muted); margin: 0 0 24px; max-width: 60ch; }

  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  /* Menu */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card-btn {
    text-align: left; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow);
    transition: transform .12s ease, border-color .12s ease;
  }
  .card-btn:hover { transform: translateY(-2px); border-color: var(--primary); }
  .card-btn .title { font-weight: 600; display: block; }
  .card-btn .meta { color: var(--muted); font-size: .9rem; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mode-btn {
    border: 0; border-radius: var(--radius); padding: 20px 18px; text-align: left;
    color: var(--primary-ink); background: var(--primary); box-shadow: var(--shadow);
  }
  .mode-btn.alt { background: var(--ink); color: var(--bg); }
  .mode-btn .title { font-weight: 700; font-size: 1.1rem; display: block; }
  .mode-btn .meta { opacity: .85; font-size: .9rem; }
  @media (max-width: 520px) { .modes { grid-template-columns: 1fr; } }

  /* Quiz */
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .ghost {
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; color: var(--muted);
  }
  .ghost:hover { border-color: var(--primary); color: var(--ink); }
  .mode-label { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .counter { color: var(--muted); font-variant-numeric: tabular-nums; }
  .progress { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
  .progress > div { height: 100%; background: var(--primary); transition: width .25s ease; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 20px; }
  .subject-tag {
    display: inline-block; background: var(--primary-soft); color: var(--primary);
    border-radius: 999px; padding: 2px 12px; font-size: .85rem; margin-bottom: 12px;
  }
  .subject-tag + .subject-tag { margin-left: 6px; }
  .subject-tag.lecture { background: var(--bg); color: var(--muted); }
  .question { font-size: 1.15rem; font-weight: 600; margin: 0 0 6px; white-space: pre-line; line-height: 1.75; }
  .q-image { display: block; max-width: 100%; height: auto; margin: 10px 0; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
  /* формулы */
  .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .15em; line-height: 1.25; }
  .frac > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 .2em; }
  .frac > span:last-child { padding: 0 .2em; }
  .mx { display: inline-block; vertical-align: middle; padding: 0 .35em; margin: 0 .12em; border-left: 2px solid currentColor; border-right: 2px solid currentColor; }
  .mx.paren { border-radius: .7em / 50%; }
  .mx table { border-collapse: collapse; }
  .mx td { padding: 1px .55em; text-align: center; font-weight: 500; font-variant-numeric: tabular-nums; }
  .mx td.aug { border-left: 1.5px solid currentColor; }
  .sys { display: inline-flex; align-items: center; vertical-align: middle; margin: 0 .15em; }
  .sys .brace { font-weight: 200; line-height: 1; margin-right: .1em; }
  .sys .eqs { display: flex; flex-direction: column; text-align: left; line-height: 1.5; }
  .vec { position: relative; display: inline-block; padding-top: .2em; }
  .vec::before { content: '→'; position: absolute; left: 0; right: 0; top: -.5em; text-align: center; font-size: .7em; line-height: 1; }
  sub, sup { line-height: 0; }
  .rad { display: inline-flex; align-items: stretch; vertical-align: middle; }
  .rad-sign { font-size: 1.15em; line-height: 1; align-self: center; }
  .rad-body { border-top: 1.5px solid currentColor; padding: 0 .12em; margin-top: .12em; }
  .rad-idx { font-size: .6em; align-self: flex-start; margin-right: -.25em; }
  .intg { display: inline-flex; align-items: center; vertical-align: middle; margin: 0 .1em; }
  .intg-sign { font-size: 1.7em; line-height: 1; font-weight: 300; }
  .intg-lims { display: inline-flex; flex-direction: column; justify-content: space-between; align-self: stretch; font-size: .72em; line-height: 1.1; margin-left: .05em; }
  .undov { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.15; margin: 0 .15em; }
  .undov-sign { font-size: 1.6em; line-height: 1; }
  .undov-sm { display: flex; flex-direction: column; align-items: center; font-size: .75em; }
  .undov-sm.ghost-lim { visibility: hidden; }
  .instruction { color: var(--muted); font-size: .92rem; margin: 0 0 16px; }

  .options { display: grid; gap: 10px; margin: 16px 0; }
  .option {
    display: flex; gap: 12px; align-items: flex-start; text-align: left;
    background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px;
    transition: border-color .12s ease, background .12s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--primary); }
  .option:disabled { cursor: default; }
  .option .mark {
    flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line);
    display: grid; place-items: center; font-weight: 700; font-size: .85rem; background: var(--surface);
  }
  .option.selected { border-color: var(--primary); background: var(--primary-soft); }
  .option.selected .mark { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .option.correct { border-color: var(--ok); background: var(--ok-soft); }
  .option.correct .mark { background: var(--ok); border-color: var(--ok); color: #fff; }
  .option.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .option.wrong .mark { background: var(--bad); border-color: var(--bad); color: #fff; }
  .option.hint { border-color: var(--hint); background: var(--hint-soft); }
  .option.missed { border-style: dashed; border-color: var(--ok); }

  .options.with-images { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .option .opt-img { display: block; max-width: 100%; height: auto; background: #fff; border-radius: 8px; padding: 4px; }
  .ovl { display: inline-block; border-top: 1.3px solid currentColor; line-height: 1.15; padding-top: 1px; }
  .mini-table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .mini-table th, .mini-table td { padding: 2px 10px 2px 0; text-align: left; font-weight: 400; }
  .mini-table th { font-weight: 700; padding-right: 14px; }
  .q-table { border-collapse: collapse; margin: 6px 0 10px; font-variant-numeric: tabular-nums; }
  .q-table th, .q-table td { border: 1px solid var(--line); padding: 6px 14px; text-align: center; }
  .q-table th { background: var(--bg); }
  .notice span, .review-item .a { white-space: pre-line; }
  .review-item img { display: block; background: #fff; border-radius: 8px; padding: 4px; margin-top: 6px; max-width: 100%; }
  .legend { margin: 0 0 14px; padding: 12px 14px 12px 34px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
  .legend li { margin: 2px 0; }
  .match-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: var(--bg); }
  .match-row.correct { border-color: var(--ok); background: var(--ok-soft); }
  .match-row.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .match-row select { font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 64px; }
  .match-row .fix { grid-column: 1 / -1; color: var(--ok); font-size: .92rem; }
  .text-answer {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 16px 0;
  }
  .text-answer.correct { border-color: var(--ok); background: var(--ok-soft); }
  .text-answer.wrong { border-color: var(--bad); background: var(--bad-soft); }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn {
    border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600;
    background: var(--primary); color: var(--primary-ink);
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.secondary { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn.hint-btn { background: var(--hint-soft); color: var(--hint); border: 1px solid var(--hint); }
  .spacer { flex: 1; }

  .notice { border-radius: 12px; padding: 12px 14px; margin: 14px 0 0; }
  .notice.ok { background: var(--ok-soft); color: var(--ok); }
  .notice.bad { background: var(--bad-soft); color: var(--bad); }
  .notice.hint { background: var(--hint-soft); color: var(--hint); }
  .notice strong { display: block; }
  .notice span { color: var(--ink); }

  /* Result */
  .result { text-align: center; }
  .percent { font-size: 3.5rem; font-weight: 700; line-height: 1; margin: 6px 0; font-variant-numeric: tabular-nums; }
  .verdict { display: inline-block; border-radius: 999px; padding: 4px 16px; font-weight: 600; margin-bottom: 18px; }
  .verdict.pass { background: var(--ok-soft); color: var(--ok); }
  .verdict.fail { background: var(--bad-soft); color: var(--bad); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0; }
  .stat { background: var(--bg); border-radius: 12px; padding: 14px; }
  .stat b { display: block; font-size: 1.6rem; }
  .stat.ok b { color: var(--ok); }
  .stat.bad b { color: var(--bad); }
  .review { text-align: left; margin-top: 24px; }
  .review-item { border-top: 1px solid var(--line); padding: 12px 0; }
  .review-item .q { font-weight: 600; margin: 0 0 4px; }
  .review-item .a { margin: 0; color: var(--ok); }
  .center { justify-content: center; }
  .note { color: var(--muted); font-size: .9rem; margin-top: 14px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   ДАННЫЕ (ФОС)
   Типы вопросов:
   - без type / "single": один правильный ответ -> correctIndex
   - "multiple": несколько правильных -> correctIndexes
   - "order": установить последовательность -> correctOrder (индексы options в правильном порядке)
   - "open": ввод текста (в исходнике нет вариантов) -> answerText + accept (ключевые основы слов)
   ========================================================= */
const SUBJECT_BZD = "Безопасность жизнедеятельности";

const data = [
  { subject: SUBJECT_BZD, type: "open",
    question: "Назовите поражающий фактор ядерного оружия, который вызывает значительные разрушения материальных объектов и механически уничтожает живую силу противника.",
    answerText: "Ударная волна", accept: ["ударная волна"] },

  { subject: SUBJECT_BZD, type: "open",
    question: "Закончите фразу: «Область резкого сжатия среды, распространяющаяся во все стороны от места взрыва со сверхзвуковой скоростью, называется...».",
    answerText: "Ударная волна", accept: ["ударная волна"] },

  { subject: SUBJECT_BZD, type: "open",
    question: "Укажите, кто в РФ утверждает план ГО и вводит его в действие (при необходимости).",
    answerText: "Президент", accept: ["президент"] },

  { subject: SUBJECT_BZD, type: "order",
    question: "Распределите зоны очага ядерного поражения по характеру механических разрушений в порядке расположения относительно эпицентра ядерного взрыва (ответ представьте последовательностью букв, например: б, д, е...):",
    options: ["зона слабых разрушений", "зона полных разрушений", "зона средних разрушений", "зона сильных разрушений"],
    correctOrder: [1, 3, 2, 0] }, // Б, Г, В, А

  { subject: SUBJECT_BZD, type: "open",
    question: "Закончите фразу: «Населенные пункты и объекты народного хозяйства, подвергшиеся непосредственному воздействию бактериологического оружия, создающего источник распространения инфекционных заболеваний, называются...».",
    answerText: "Бактериологические", accept: ["бактериологическ"] },

  { subject: SUBJECT_BZD, type: "open",
    question: "Приведите название сигнала, используемого органами гражданской обороны и чрезвычайных ситуаций (ГОЧС) для привлечения внимания населения к речевой информации об опасностях, возникших за счет ЧС мирного или военного времени.",
    answerText: "Сирена («Внимание всем!»)", accept: ["сирен", "внимание всем"] },

  { subject: SUBJECT_BZD, type: "open",
    question: "Закончите фразу: «Оружие массового поражения, действие которого основано на использовании способности некоторых микроорганизмов вызывать различные заболевания и отравления, называется...».",
    answerText: "Биологическое (бактериологическое) оружие", accept: ["биологическ", "бактериологическ"] },

  { subject: SUBJECT_BZD, type: "multiple",
    question: "Геологические ЧС (ЧС в литосфере) — это:",
    options: ["оползни", "ураганы", "заторы", "бури", "землетрясения"],
    correctIndexes: [0, 4] }, // а, д

  { subject: SUBJECT_BZD, type: "multiple",
    question: "Назовите причины возникновения землетрясений:",
    options: ["разрывы в земной коре", "усиление химических процессов в недрах земли", "плохая погода", "деятельность человека"],
    correctIndexes: [0, 1, 3] }, // а, б, г

  { subject: SUBJECT_BZD, type: "multiple",
    question: "Среди перечисленных поражающих факторов выберите те, которые характерны для химических аварий с выбросом АХОВ:",
    options: ["лучистый поток энергии", "проникновение опасных веществ через органы дыхания в организм человека", "поражение людей опасными веществами через кожные покровы", "интенсивное излучение гамма-лучей, поражающее людей"],
    correctIndexes: [1, 2] }, // б, в

  { subject: SUBJECT_BZD,
    question: "Объект, при аварии или разрушении которого могут произойти массовые поражения людей, животных и растений опасными химическими веществами, это:",
    options: ["гидродинамически опасный объект", "химически опасный объект", "пожароопасный объект"],
    correctIndex: 1 }, // б

  { subject: SUBJECT_BZD,
    question: "Что используют для обнаружения и измерения энергии радиоактивных излучений?",
    options: ["специальные весы", "специальные шкалы баллов", "бинокли", "дозиметрические приборы"],
    correctIndex: 3 }, // г

  { subject: SUBJECT_BZD, type: "order",
    question: "Укажите последовательность действий при переломе конечности:",
    options: ["доставить пострадавшего в медицинское учреждение", "иммобилизовать конечность путем наложения шины или подручного средства", "дать обезболивающий препарат", "положить холодный пузырь на место отека"],
    correctOrder: [1, 3, 2, 0] }, // б, г, в, а

  { subject: SUBJECT_BZD, type: "multiple",
    question: "Перечислите признаки артериального кровотечения:",
    options: ["кровь темного цвета", "кровь пассивно вытекает из раны", "кровь ярко-красного цвета, фонтанирующей струей вытекает из раны", "большое кровавое пятно на одежде или рядом с пострадавшим"],
    correctIndexes: [2, 3] }, // в, г

  { subject: SUBJECT_BZD,
    question: "Когда следует начинать сердечно-легочную реанимацию пострадавшего?",
    options: ["При наличии болей в области сердца и затрудненного дыхания", "При потере пострадавшим сознания, независимо от наличия пульса на сонной артерии, и признаков дыхания", "При потере пострадавшим сознания и отсутствии пульса на сонной артерии, а также признаков дыхания"],
    correctIndex: 2 }, // в

  { subject: SUBJECT_BZD,
    question: "Какова первая помощь при наличии признаков термического ожога второй степени (покраснение и отек кожи, образование на месте ожога пузырей, наполненных жидкостью, сильная боль)?",
    options: ["Полить ожоговую поверхность холодной водой, накрыть стерильной салфеткой и туго забинтовать", "Вскрыть пузыри, очистить ожоговую поверхность от остатков одежды, накрыть стерильной салфеткой (не бинтовать), по возможности приложить холод, поить пострадавшего водой", "Пузыри не вскрывать, остатки одежды с обожженной поверхности не удалять, рану накрыть стерильной салфеткой (не бинтовать), по возможности приложить холод и поить пострадавшего водой"],
    correctIndex: 2 }, // в

  // ВНИМАНИЕ: в рукописном ответе указано «в, б». Вариант «б» (укрытие у одиноко стоящего дерева)
  // опасен при грозе, а вариант «д» виден на следующем листе — правильными оставлены «в» и «д».
  // Если по ключу ФОС иначе — измените correctIndexes ([2, 4] = в, д; [2, 1] = в, б).
  { subject: SUBJECT_BZD, type: "multiple",
    question: "Чтобы избежать удара молнии, лучше всего:",
    options: ["спрятаться под скрытым навесом", "укрыться возле одиноко стоящего дерева с раскидистой кроной", "спрятаться в сухой яме, канаве, овраге", "находиться в воде, а не на суше", "находиться на суше, а не в воде"],
    correctIndexes: [2, 4] },

  { subject: SUBJECT_BZD,
    question: "Первым действием (первым этапом) при оказании первой помощи является:",
    options: ["Прекращение воздействия травмирующего фактора", "Правильная транспортировка пострадавшего", "Предотвращение возможных осложнений"],
    correctIndex: 0 }, // а

  { subject: SUBJECT_BZD,
    question: "В каком объеме проводятся мероприятия при прекращении сердечной деятельности и дыхания у пострадавшего?",
    options: ["Освобождение дыхательных путей, проведение ИВЛ (искусственной вентиляции легких) и НМС (непрямого массажа сердца)", "Освобождение дыхательных путей, проведение ИВЛ (искусственной вентиляции легких)", "Проведение НМС (непрямого массажа сердца)"],
    correctIndex: 0 }, // а

// Фишер–Йетс: возвращает новый массив
function shuffle(array) {
  const a = array.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

/* ---------- Мини-разметка формул ---------- */
const RICH_CMDS = { f: 2, m: 1, d: 1, s: 1, v: 1, am: 2, rt: 2, 'in': 2, sm: 2, lm: 1, o: 1 };

function readGroup(s, i) { // s[i] === '{'; возвращает [содержимое, индекс после '}']
  let depth = 0;
  for (let j = i; j < s.length; j++) {
    if (s[j] === '{') depth++;
    else if (s[j] === '}') { depth--; if (depth === 0) return [s.slice(i + 1, j), j + 1]; }
  }
  return [s.slice(i + 1), s.length];
}

function splitTop(s, sep) { // делит по sep вне фигурных скобок
  const out = []; let depth = 0, cur = '';
  for (const ch of s) {
    if (ch === '{') depth++;
    if (ch === '}') depth--;
    if (ch === sep && depth === 0) { out.push(cur); cur = ''; } else cur += ch;
  }
  out.push(cur);
  return out;
}

function matrixEl(kind, rowsSrc, rightSrc) {
  const box = el('span', 'mx ' + (kind === 'd' ? 'bar' : 'paren'));
  const table = el('table');
  const left = splitTop(rowsSrc, ';').map(r => splitTop(r, ','));
  const right = rightSrc ? splitTop(rightSrc, ';').map(r => splitTop(r, ',')) : null;
  left.forEach((cells, ri) => {
    const tr = el('tr');
    cells.forEach(c => { const td = el('td'); td.appendChild(rich(c)); tr.appendChild(td); });
    if (right && right[ri]) right[ri].forEach((c, ci) => { const td = el('td', ci === 0 ? 'aug' : ''); td.appendChild(rich(c)); tr.appendChild(td); });
    table.appendChild(tr);
  });
  box.appendChild(table);
  return box;
}

function buildRich(name, args) {
  if (name === 'f') {
    const f = el('span', 'frac');
    const n = el('span'); n.appendChild(rich(args[0]));
    const d = el('span'); d.appendChild(rich(args[1]));
    f.appendChild(n); f.appendChild(d);
    return f;
  }
  if (name === 'm' || name === 'd') return matrixEl(name, args[0]);
  if (name === 'am') return matrixEl('m', args[0], args[1]);
  if (name === 's') {
    const eqs = splitTop(args[0], ';');
    const sys = el('span', 'sys');
    const brace = el('span', 'brace', '{');
    brace.style.fontSize = (eqs.length * 1.3).toFixed(1) + 'em';
    const col = el('span', 'eqs');
    eqs.forEach(e => { const line = el('span'); line.appendChild(rich(e)); col.appendChild(line); });
    sys.appendChild(brace); sys.appendChild(col);
    return sys;
  }
  if (name === 'v') { const v = el('span', 'vec'); v.appendChild(rich(args[0])); return v; }
  if (name === 'o') { const o = el('span', 'ovl'); o.appendChild(rich(args[0])); return o; } // надчёркивание (отрицание)
  if (name === 'rt') { // корень: \rt{показатель}{выражение}
    const r = el('span', 'rad');
    if (args[0]) { const idx = el('sup', 'rad-idx'); idx.appendChild(rich(args[0])); r.appendChild(idx); }
    r.appendChild(el('span', 'rad-sign', '√'));
    const body = el('span', 'rad-body'); body.appendChild(rich(args[1])); r.appendChild(body);
    return r;
  }
  if (name === 'in') { // интеграл: \in{нижний}{верхний}
    const w = el('span', 'intg');
    w.appendChild(el('span', 'intg-sign', '∫'));
    if (args[0] || args[1]) {
      const lims = el('span', 'intg-lims');
      const hi = el('span'); hi.appendChild(rich(args[1]));
      const lo = el('span'); lo.appendChild(rich(args[0]));
      lims.appendChild(hi); lims.appendChild(lo);
      w.appendChild(lims);
    }
    return w;
  }
  if (name === 'sm') { // сумма: \sm{нижний}{верхний}
    const w = el('span', 'undov');
    const hi = el('span', 'undov-sm'); hi.appendChild(rich(args[1]));
    const lo = el('span', 'undov-sm'); lo.appendChild(rich(args[0]));
    w.appendChild(hi); w.appendChild(el('span', 'undov-sign', '∑')); w.appendChild(lo);
    return w;
  }
  if (name === 'lm') { // предел: \lm{x→0}; несколько условий — через ;
    const w = el('span', 'undov');
    const lines = splitTop(args[0], ';');
    const ghost = el('span', 'undov-sm ghost-lim'); // невидимая копия сверху — чтобы «lim» стоял на строке
    const sub = el('span', 'undov-sm');
    lines.forEach(l => {
      const a = el('span'); a.appendChild(rich(l)); ghost.appendChild(a);
      const b = el('span'); b.appendChild(rich(l)); sub.appendChild(b);
    });
    ghost.setAttribute('aria-hidden', 'true');
    w.appendChild(ghost); w.appendChild(el('span', null, 'lim')); w.appendChild(sub);
    return w;
  }
  return document.createTextNode('');
}

/* Превращает строку с разметкой в DOM (текст, индексы, дроби, матрицы...) */
function rich(str) {
  const s = String(str);
  const frag = document.createDocumentFragment();
  let buf = '', i = 0;
  const flush = () => { if (buf) { frag.appendChild(document.createTextNode(buf)); buf = ''; } };
  while (i < s.length) {
    const ch = s[i];
    if (ch === '\\') {
      const m = /^\\([a-z]+)/.exec(s.slice(i));
      if (m && RICH_CMDS[m[1]] && s[i + m[0].length] === '{') {
        flush();
        let j = i + m[0].length;
        const args = [];
        for (let k = 0; k < RICH_CMDS[m[1]]; k++) {
          if (s[j] !== '{') { args.push(''); continue; }
          const g = readGroup(s, j); args.push(g[0]); j = g[1];
        }
        frag.appendChild(buildRich(m[1], args));
        i = j; continue;
      }
    }
    if ((ch === '^' || ch === '_') && s[i + 1] === '{') {
      flush();
      const g = readGroup(s, i + 1);
      const e = el(ch === '^' ? 'sup' : 'sub');
      e.appendChild(rich(g[0]));
      frag.appendChild(e);
      i = g[1]; continue;
    }
    buf += ch; i++;
  }
  flush();
  return frag;
}

function richEl(tag, className, text) {
  const node = el(tag, className);
  node.appendChild(rich(text));
  return node;
}

function sameSet(a, b) {
  return a.length === b.length && a.every(x => b.includes(x));
}

function sameSeq(a, b) {
  return a.length === b.length && a.every((x, i) => x === b[i]);
}

function pluralize(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

function normalize(s) {
  return s.toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9]+/g, ' ').trim();
}

function subjects() {
  return [...new Set(data.map(q => q.subject))];
}

/* Предметы вида "Папка — Раздел" группируются в папку "Папка" с разделами внутри неё. */
const FOLDER_SEP = ' — ';
function topLevelName(subjectName) {
  const idx = subjectName.indexOf(FOLDER_SEP);
  return idx === -1 ? subjectName : subjectName.slice(0, idx);
}
function sectionLabel(subjectName) {
  const idx = subjectName.indexOf(FOLDER_SEP);
  return idx === -1 ? null : subjectName.slice(idx + FOLDER_SEP.length);
}
function folderMap() {
  const folders = {};
  subjects().forEach(name => {
    const top = topLevelName(name);
    (folders[top] = folders[top] || []).push(name);
  });
  return folders;
}

function qType(q) { return q.type || 'single'; }

/* Готовит вопрос: перемешивает варианты и пересчитывает правильные индексы */
function prepare(q) {
  const copy = Object.assign({}, q);
  if (qType(q) === 'match') {
    const lp = shuffle(q.left.map((_, i) => i));
    const rp = shuffle(q.right.map((_, i) => i));
    copy.left = lp.map(i => q.left[i]);
    copy.right = rp.map(i => q.right[i]);
    copy.correctMap = lp.map(i => rp.indexOf(q.correctMap[i]));
    return copy;
  }
  if (!q.options) return copy;

  let perm; // perm[newPos] = oldIndex
  let tries = 0;
  do {
    perm = shuffle(q.options.map((_, i) => i));
    tries++;
    // для последовательностей не оставляем сразу готовый правильный порядок
  } while (qType(q) === 'order' && tries < 20 && sameSeq(perm, q.correctOrder));

  const newPos = old => perm.indexOf(old);
  copy.options = perm.map(i => q.options[i]);

  if (qType(q) === 'single') copy.correctIndex = newPos(q.correctIndex);
  if (qType(q) === 'multiple') copy.correctIndexes = q.correctIndexes.map(newPos);
  if (qType(q) === 'order') copy.correctOrder = q.correctOrder.map(newPos);
  return copy;
}

const letter = i => String.fromCharCode(1072 + i); // а, б, в, г...

function optionPlainText(opt, i) {
  if (opt && typeof opt === 'object') return 'вариант ' + letter(i) + ')';
  if (typeof opt === 'string' && opt.indexOf('\n') >= 0) return opt.split('\n').map(r => r.split('\t').join(' ')).join('; ');
  return opt;
}

/* Содержимое варианта: текст, рисунок или маленькая таблица */
function optionContent(opt) {
  const span = el('span', 'txt');
  if (opt && typeof opt === 'object' && opt.img) {
    const im = el('img', 'opt-img');
    im.src = opt.img;
    im.alt = opt.alt || 'Вариант ответа (рисунок)';
    span.appendChild(im);
  } else if (typeof opt === 'string' && opt.indexOf('\n') >= 0) {
    span.appendChild(buildTable(opt, 'mini-table'));
  } else {
    span.appendChild(rich(opt));
  }
  return span;
}

function buildTable(text, cls) {
  const t = el('table', cls);
  text.split('\n').forEach(row => {
    const tr = el('tr');
    row.split('\t').forEach((c, ci) => tr.appendChild(el(ci === 0 ? 'th' : 'td', null, c)));
    t.appendChild(tr);
  });
  return t;
}

function correctAnswerText(q) {
  switch (qType(q)) {
    case 'match': return q.left.map((l, i) => l + ' → ' + q.right[q.correctMap[i]]).join('\n');
    case 'single': return optionPlainText(q.options[q.correctIndex], q.correctIndex);
    case 'multiple': return q.correctIndexes.slice().sort((a, b) => a - b).map(i => optionPlainText(q.options[i], i)).join('; ');
    case 'order': return q.correctOrder.map(i => optionPlainText(q.options[i], i)).join(' → ');
    case 'open':
    case 'recall': return q.answerText;
  }
}

/* Автоматический расчёт пропорций для экзамена (метод наибольших остатков) */
function buildExam(total) {
  const groups = {};
  data.forEach(q => (groups[q.subject] = groups[q.subject] || []).push(q));
  const names = Object.keys(groups);
  const all = data.length;
  const n = Math.min(total, all);

  const quotas = {};
  const fracs = [];
  let assigned = 0;
  names.forEach(name => {
    const exact = groups[name].length * n / all;
    quotas[name] = Math.min(Math.floor(exact), groups[name].length);
    assigned += quotas[name];
    fracs.push({ name, frac: exact - Math.floor(exact) });
  });
  fracs.sort((a, b) => b.frac - a.frac);

  // раздаём остаток; если в предмете не хватает вопросов — берём все доступные и передаём дальше
  let guard = 0;
  while (assigned < n && guard < 10000) {
    for (const f of fracs) {
      if (assigned >= n) break;
      if (quotas[f.name] < groups[f.name].length) { quotas[f.name]++; assigned++; }
    }
    guard++;
  }

  let picked = [];
  names.forEach(name => { picked = picked.concat(shuffle(groups[name]).slice(0, quotas[name])); });
  return shuffle(picked);
}

/* =========================================================
   ЗАПУСК РЕЖИМОВ
   ========================================================= */
function start(mode, subject) {
  state.mode = mode;
  state.subject = subject || null;
  state.index = 0;
  state.score = 0;
  state.wrong = 0;
  state.mistakes = [];

  if (mode === 'subject') state.queue = shuffle(data.filter(q => q.subject === subject));
  else if (mode === 'marathon') state.queue = shuffle(data);
  else state.queue = buildExam(EXAM_SIZE);

  loadQuestion();
}

function modeTitle() {
  if (state.mode === 'subject') return state.subject;
  if (state.mode === 'marathon') return 'Марафон';
  return 'Экзамен';
}

function loadQuestion() {
  state.current = prepare(state.queue[state.index]);
  state.answered = false;
  state.hintShown = false;
  state.revealed = false;
  state.selected = state.current.type === 'match' ? state.current.left.map(() => -1) : [];
  renderQuestion();
}

/* =========================================================
   ЭКРАНЫ
   ========================================================= */
function renderMenu() {
  app.innerHTML = '';
  app.appendChild(el('h1', null, 'Подготовка к аккредитации'));
  app.appendChild(el('p', 'lead', 'Выберите предмет для тренировки или запустите смешанный режим.'));

  app.appendChild(el('h2', null, 'Предметы'));
  const grid = el('div', 'grid');
  const folders = folderMap();
  Object.keys(folders).forEach(top => {
    const list = folders[top];
    const isFolder = list.length > 1;
    const count = data.filter(q => list.includes(q.subject)).length;
    const b = el('button', 'card-btn');
    b.appendChild(el('span', 'title', top + (isFolder ? ' 📂' : '')));
    const meta = isFolder
      ? list.length + ' ' + pluralize(list.length, 'раздел', 'раздела', 'разделов') + ' · ' + count + ' ' + pluralize(count, 'вопрос', 'вопроса', 'вопросов')
      : count + ' ' + pluralize(count, 'вопрос', 'вопроса', 'вопросов') + ' · с подсказками';
    b.appendChild(el('span', 'meta', meta));
    b.addEventListener('click', () => isFolder ? renderFolder(top, list) : start('subject', list[0]));
    grid.appendChild(b);
  });
  app.appendChild(grid);

  const modes = el('div', 'modes');
  const examCount = Math.min(EXAM_SIZE, data.length);

  const m = el('button', 'mode-btn');
  m.appendChild(el('span', 'title', 'МАРАФОН'));
  m.appendChild(el('span', 'meta', 'Все ' + data.length + ' ' + pluralize(data.length, 'вопрос', 'вопроса', 'вопросов') + ' вперемешку, без подсказок'));
  m.addEventListener('click', () => start('marathon'));
  modes.appendChild(m);

  const e = el('button', 'mode-btn alt');
  e.appendChild(el('span', 'title', 'ЭКЗАМЕН ' + EXAM_SIZE + ' ВОПРОСОВ'));
  e.appendChild(el('span', 'meta',
    examCount < EXAM_SIZE
      ? 'В базе только ' + data.length + ' — в тесте будут все; проходной балл ' + PASS_PERCENT + '%'
      : 'Пропорционально предметам, проходной балл ' + PASS_PERCENT + '%'));
  e.addEventListener('click', () => start('exam'));
  modes.appendChild(e);
  app.appendChild(modes);
}

function renderFolder(top, list) {
  app.innerHTML = '';

  const top1 = el('div', 'topbar');
  const back = el('button', 'ghost', '← Меню');
  back.addEventListener('click', renderMenu);
  top1.appendChild(back);
  app.appendChild(top1);

  app.appendChild(el('h1', null, top));
  app.appendChild(el('p', 'lead', 'Выберите раздел.'));

  const grid = el('div', 'grid');
  list.forEach(name => {
    const count = data.filter(q => q.subject === name).length;
    const b = el('button', 'card-btn');
    b.appendChild(el('span', 'title', sectionLabel(name) || name));
    b.appendChild(el('span', 'meta', count + ' ' + pluralize(count, 'вопрос', 'вопроса', 'вопросов') + ' · с подсказками'));
    b.addEventListener('click', () => start('subject', name));
    grid.appendChild(b);
  });
  app.appendChild(grid);
}

function renderQuestion() {
  const q = state.current;
  const type = qType(q);
  app.innerHTML = '';

  // верхняя панель
  const top = el('div', 'topbar');
  const back = el('button', 'ghost', 'Меню');
  back.addEventListener('click', () => {
    if (confirm('Выйти в меню? Прогресс будет потерян.')) renderMenu();
  });
  top.appendChild(back);
  top.appendChild(el('div', 'mode-label', modeTitle()));
  top.appendChild(el('div', 'counter', (state.index + 1) + ' / ' + state.queue.length));
  app.appendChild(top);

  const progress = el('div', 'progress');
  const bar = el('div');
  bar.style.width = (state.index / state.queue.length * 100) + '%';
  progress.appendChild(bar);
  app.appendChild(progress);

  // карточка вопроса
  const panel = el('div', 'panel');
  if (state.mode !== 'subject') panel.appendChild(el('span', 'subject-tag', q.subject));
  else panel.appendChild(el('span', 'subject-tag', 'Верно: ' + state.score + ' · Ошибок: ' + state.wrong));
  if (q.lecture) panel.appendChild(el('span', 'subject-tag lecture', q.lecture));
  panel.appendChild(richEl('p', 'question', q.question));
  if (q.image) { const qi = el('img', 'q-image'); qi.src = q.image; qi.alt = 'Рисунок к вопросу'; panel.appendChild(qi); }

  const instructions = {
    single: 'Выберите один правильный ответ.',
    multiple: 'Выберите все правильные ответы и нажмите «Проверить».',
    order: 'Нажимайте варианты в правильной последовательности, затем «Проверить».',
    open: 'Введите ответ и нажмите «Проверить».',
    match: 'Для каждого пункта выберите номер соответствующего варианта и нажмите «Проверить».',
    recall: 'Вспомните ответ, затем нажмите «Показать ответ» и отметьте, знали ли вы его.'
  };
  if (q.table) panel.appendChild(buildTable(q.table, 'q-table'));
  if (q.after) panel.appendChild(richEl('p', 'question', q.after));
  panel.appendChild(el('p', 'instruction', instructions[type]));

  const feedbackBox = el('div');
  feedbackBox.id = 'feedback';

  if (type === 'open') {
    const input = el('input', 'text-answer');
    input.type = 'text';
    input.id = 'open-input';
    input.placeholder = 'Ваш ответ';
    input.autocomplete = 'off';
    input.addEventListener('keydown', ev => { if (ev.key === 'Enter') checkAnswer(); });
    panel.appendChild(input);
  } else if (type !== 'recall') {
    if (type === 'match') {
      const legend = el('ol', 'legend');
      q.right.forEach(r => legend.appendChild(richEl('li', null, r)));
      panel.appendChild(legend);
      const rows = el('div');
      rows.id = 'options';
      q.left.forEach((l, i) => {
        const row = el('div', 'match-row');
        row.dataset.i = i;
        row.appendChild(richEl('span', null, letter(i) + ') ' + l));
        const sel = el('select');
        sel.setAttribute('aria-label', 'Соответствие для пункта ' + letter(i));
        sel.appendChild(new Option('—', '-1'));
        q.right.forEach((_, k) => sel.appendChild(new Option(String(k + 1), String(k))));
        sel.addEventListener('change', () => {
          state.selected[i] = Number(sel.value);
          const c = document.getElementById('check-btn');
          if (c) c.disabled = state.selected.some(v => v < 0);
        });
        row.appendChild(sel);
        rows.appendChild(row);
      });
      panel.appendChild(rows);
    } else {
      const list = el('div', 'options');
      list.id = 'options';
      if (q.options.some(o => o && typeof o === 'object')) list.classList.add('with-images');
      q.options.forEach((opt, i) => {
        const b = el('button', 'option');
        b.dataset.i = i;
        b.appendChild(el('span', 'mark', type === 'multiple' ? '' : (type === 'order' ? '' : letter(i))));
        b.appendChild(optionContent(opt));
        b.addEventListener('click', () => onOptionClick(i));
        list.appendChild(b);
      });
      panel.appendChild(list);
    }
  }

  panel.appendChild(feedbackBox);

  // кнопки
  const actions = el('div', 'actions');
  actions.id = 'actions';
  panel.appendChild(actions);
  app.appendChild(panel);

  refreshActions();
}

function refreshActions() {
  const q = state.current;
  const type = qType(q);
  const actions = document.getElementById('actions');
  actions.innerHTML = '';

  if (state.answered) {
    const last = state.index === state.queue.length - 1;
    const next = el('button', 'btn', last ? 'Показать результат' : 'Следующий вопрос');
    next.addEventListener('click', nextQuestion);
    actions.appendChild(next);
    next.focus();
    return;
  }

  if (type === 'recall') {
    if (!state.revealed) {
      const show = el('button', 'btn', 'Показать ответ');
      show.addEventListener('click', revealAnswer);
      actions.appendChild(show);
    } else {
      const knew = el('button', 'btn', 'Знал ответ');
      knew.addEventListener('click', () => finish(true));
      const didnt = el('button', 'btn secondary', 'Не знал');
      didnt.addEventListener('click', () => finish(false));
      actions.appendChild(knew);
      actions.appendChild(didnt);
    }
    return;
  }

  if (type !== 'single') {
    const check = el('button', 'btn', 'Проверить');
    check.id = 'check-btn';
    if (type === 'multiple') check.disabled = state.selected.length === 0;
    if (type === 'order') check.disabled = state.selected.length !== q.options.length;
    if (type === 'match') check.disabled = state.selected.some(v => v < 0);
    check.addEventListener('click', checkAnswer);
    actions.appendChild(check);
  }
  if (type === 'order') {
    const reset = el('button', 'btn secondary', 'Сбросить');
    reset.addEventListener('click', () => { state.selected = []; paintSelection(); refreshActions(); });
    actions.appendChild(reset);
  }

  // Подсказка — только в режиме «Подготовка по предмету»
  if (state.mode === 'subject') {
    actions.appendChild(el('span', 'spacer'));
    const hint = el('button', 'btn hint-btn', 'Подсказка');
    hint.addEventListener('click', showHint);
    actions.appendChild(hint);
  }
}

/* ---------- выбор вариантов ---------- */
function onOptionClick(i) {
  if (state.answered) return;
  const type = qType(state.current);

  if (type === 'single') {
    state.selected = [i];
    finish(i === state.current.correctIndex);
    return;
  }
  if (type === 'multiple') {
    const pos = state.selected.indexOf(i);
    if (pos >= 0) state.selected.splice(pos, 1); else state.selected.push(i);
  }
  if (type === 'order') {
    const pos = state.selected.indexOf(i);
    if (pos >= 0) state.selected.splice(pos, 1); else state.selected.push(i);
  }
  paintSelection();
  const check = document.getElementById('check-btn');
  if (check) {
    check.disabled = type === 'multiple'
      ? state.selected.length === 0
      : state.selected.length !== state.current.options.length;
  }
}

function paintSelection() {
  const type = qType(state.current);
  document.querySelectorAll('#options .option').forEach(btn => {
    const i = Number(btn.dataset.i);
    const pos = state.selected.indexOf(i);
    const mark = btn.querySelector('.mark');
    btn.classList.toggle('selected', pos >= 0);
    if (type === 'multiple') mark.textContent = pos >= 0 ? '✓' : '';
    if (type === 'order') mark.textContent = pos >= 0 ? (pos + 1) : '';
  });
}

/* ---------- проверка ---------- */
function checkAnswer() {
  if (state.answered) return;
  const q = state.current;
  const type = qType(q);
  let ok = false;

  if (type === 'match') ok = state.selected.every((v, i) => v === q.correctMap[i]);
  else if (type === 'multiple') ok = sameSet(state.selected, q.correctIndexes);
  else if (type === 'order') ok = sameSeq(state.selected, q.correctOrder);
  else if (type === 'open') {
    const input = document.getElementById('open-input');
    const val = normalize(input.value);
    if (!val) { input.focus(); return; }
    if (q.numeric !== undefined) {
      const nums = input.value.replace(/[−–]/g, '-').replace(',', '.').match(/-?\d+(?:\.\d+)?/g);
      ok = !!nums && nums.length === 1 && Number(nums[0]) === q.numeric;
    } else {
      ok = q.accept.some(stem => val.includes(normalize(stem)));
    }
    input.classList.add(ok ? 'correct' : 'wrong');
    input.disabled = true;
  }
  finish(ok);
}

function revealAnswer() {
  if (state.answered || state.revealed) return;
  state.revealed = true;
  const box = el('div', 'notice hint');
  box.appendChild(el('strong', null, 'Ответ'));
  box.appendChild(richEl('span', null, correctAnswerText(state.current)));
  document.getElementById('feedback').replaceChildren(box);
  refreshActions();
}

function showHint() {
  if (state.answered || state.hintShown) return;
  state.hintShown = true;
  const q = state.current;
  const type = qType(q);

  if (type === 'single') document.querySelectorAll('#options .option')[q.correctIndex].classList.add('hint');
  if (type === 'multiple') q.correctIndexes.forEach(i => document.querySelectorAll('#options .option')[i].classList.add('hint'));

  const box = el('div', 'notice hint');
  box.appendChild(el('strong', null, 'Подсказка'));
  box.appendChild(richEl('span', null, correctAnswerText(q)));
  document.getElementById('feedback').replaceChildren(box);
}

function finish(ok) {
  const q = state.current;
  const type = qType(q);
  state.answered = true;
  if (ok) state.score++; else { state.wrong++; state.mistakes.push({ question: q.question + (q.after ? ' ' + q.after : ''), answer: correctAnswerText(q), img: (type === 'single' && q.options[q.correctIndex] && q.options[q.correctIndex].img) || null }); }

  // раскраска
  if (type === 'match') {
    document.querySelectorAll('#options .match-row').forEach((row, i) => {
      row.querySelector('select').disabled = true;
      const right = state.selected[i] === q.correctMap[i];
      row.classList.add(right ? 'correct' : 'wrong');
      if (!right) row.appendChild(richEl('span', 'fix', 'Верно: ' + (q.correctMap[i] + 1) + ') ' + q.right[q.correctMap[i]]));
    });
  }
  const buttons = document.querySelectorAll('#options .option');
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    btn.classList.remove('hint', 'selected');
    if (type === 'single') {
      if (i === q.correctIndex) btn.classList.add('correct');
      else if (state.selected[0] === i) btn.classList.add('wrong');
    } else if (type === 'multiple') {
      const isCorrect = q.correctIndexes.includes(i);
      const chosen = state.selected.includes(i);
      if (isCorrect && chosen) btn.classList.add('correct');
      else if (!isCorrect && chosen) btn.classList.add('wrong');
      else if (isCorrect && !chosen) btn.classList.add('correct', 'missed');
    } else if (type === 'order') {
      const mark = btn.querySelector('.mark');
      const correctPos = q.correctOrder.indexOf(i);
      const chosenPos = state.selected.indexOf(i);
      mark.textContent = correctPos + 1;
      btn.classList.add(chosenPos === correctPos ? 'correct' : 'wrong');
    }
  });

  const box = el('div', 'notice ' + (ok ? 'ok' : 'bad'));
  const isRecall = type === 'recall';
  box.appendChild(el('strong', null, ok ? (isRecall ? 'Засчитано' : 'Верно!') : (isRecall ? 'Нужно повторить' : 'Неверно')));
  if (!ok && type !== 'match') {
    const label = type === 'order' ? 'Правильный порядок: ' : 'Правильный ответ: ';
    box.appendChild(richEl('span', null, label + correctAnswerText(q)));
  }
  document.getElementById('feedback').replaceChildren(box);
  refreshActions();
}

function nextQuestion() {
  state.index++;
  if (state.index >= state.queue.length) renderResult();
  else loadQuestion();
}

/* ---------- результат ---------- */
function renderResult() {
  const total = state.queue.length;
  const percent = Math.round(state.score / total * 100);
  const passed = percent >= PASS_PERCENT;
  app.innerHTML = '';

  const panel = el('div', 'panel result');
  panel.appendChild(el('h1', null, state.mode === 'exam' ? 'Результат экзамена' : 'Результат: ' + modeTitle()));
  panel.appendChild(el('div', 'percent', percent + '%'));
  panel.appendChild(el('div', 'verdict ' + (passed ? 'pass' : 'fail'),
    passed ? 'Сдано (порог ' + PASS_PERCENT + '%)' : 'Не сдано (порог ' + PASS_PERCENT + '%)'));

  const stats = el('div', 'stats');
  const ok = el('div', 'stat ok'); ok.appendChild(el('b', null, String(state.score))); ok.appendChild(document.createTextNode('правильных'));
  const bad = el('div', 'stat bad'); bad.appendChild(el('b', null, String(state.wrong))); bad.appendChild(document.createTextNode('неправильных'));
  stats.appendChild(ok); stats.appendChild(bad);
  panel.appendChild(stats);

  const actions = el('div', 'actions center');
  const again = el('button', 'btn', 'Пройти заново');
  again.addEventListener('click', () => start(state.mode, state.subject));
  const menu = el('button', 'btn secondary', 'В меню');
  menu.addEventListener('click', renderMenu);
  actions.appendChild(again); actions.appendChild(menu);
  panel.appendChild(actions);

  if (state.mode === 'exam' && total < EXAM_SIZE) {
    panel.appendChild(el('p', 'note', 'В базе пока ' + total + ' ' + pluralize(total, 'вопрос', 'вопроса', 'вопросов') + ' — экзамен собран из всех доступных.'));
  }

  if (state.mistakes.length) {
    const review = el('div', 'review');
    review.appendChild(el('h2', null, 'Разбор ошибок'));
    state.mistakes.forEach(m => {
      const item = el('div', 'review-item');
      item.appendChild(richEl('p', 'q', m.question));
      item.appendChild(richEl('p', 'a', m.answer));
      if (m.img) { const im = el('img'); im.src = m.img; im.alt = 'Правильный вариант'; item.appendChild(im); }
      review.appendChild(item);
    });
    panel.appendChild(review);
  }
  app.appendChild(panel);
  window.scrollTo(0, 0);
}

renderMenu();
</script>
